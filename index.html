<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <div class="heading">
            <h1>Survey Form</h1>
        </div>
   
   <form id="survey1-form">
    <div class="survey-form">
        <div class="name common">
            <p class="para">Full Name</p>
        <input type="text" placeholder="Enter your full name" class="name-input">
        </div>

        <div class="phone-number common">
            <p class="para">Phone Number</p>
            <input type="text" placeholder="Enter your phone number" class="phone-input">
        </div>

        <div class="email common">
            <p class="para">Email</p>
            <input type="text" placeholder="Enter your email" class="email-input">
        </div>

        <div class="gender common">
            <p class="para">Gender</p>
            <span class="gender-input"><input type="radio" name="gender" value="male"> Male</span>
            <span class="gender-input"><input type="radio" name="gender" value="female"> Female</span>
        </div>

        <div class="age common">
            <p class="para">Select your Age</p>
            <span class="gender-input"><input type="radio" name="age" value="18-25"> 18-25</span>
            <span class="gender-input"><input type="radio" name="age" value="26-35"> 26-35</span>
            <span class="gender-input"><input type="radio" name="age" value="36-45"> 36-45</span>
            <span class="gender-input"><input type="radio" name="age" value="46+"> 46+</span>
        </div>


        <div class="Experience common">
            <p class="para">How was your experience with our service?</p>
            <span class="gender-input"><input type="radio" name="experience" value="excellent"> Excellent</span>
            <span class="gender-input"><input type="radio" name="experience" value="good"> Good</span>
            <span class="gender-input"><input type="radio" name="experience" value="average"> Average</span>
            <span class="gender-input"><input type="radio" name="experience" value="poor"> Poor</span>
        </div>

        <div class="comments common">
            <p class="para">Additional Comments</p>
            <textarea placeholder="Enter your comments here" class="textarea-input"></textarea>
        </div>
    </div>

    <div class="submit-button">
        <button type="submit" class="submit-text">Submit</button>
    </div>

   </form>



   <script src="script.js"></script>
    
</body>
</html>
